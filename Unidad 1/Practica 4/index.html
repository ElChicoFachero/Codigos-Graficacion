<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Practica 4</title>
    <style>
        body
        {
            font-family: sans-serif;
            text-align: center;
            background: #f8fafc;
        }
        canvas
        {
            border: 1px solid #94a3b8;
            margin: 20px;
        }
        button
        {
           padding: 10px 20px;
           background: #0284c7;
           color: white;
           border: none;
           border-radius: 5px;
           cursor: pointer; 
           margin: 0 5px;
        }
        button:hover{
            background: #0369a1;
        }
        .control{
            margin-top: 15px;
            padding: 15px;
            background: #e2e8f0;
            display: inline-block;
            border-radius: 8px;
        }
        
    </style>
</head>
<body>
    <h2> Procesamiento de Comprobantes Aduanales (Matriz de Pixeles) </h2>
    <canvas id="lienzoImagen" width="400" height="300"></canvas>
    <br>
    <button id="btnGris">1. Escala de Grises </button>
    <button id="btnUmbral">2. Binarizar (OCR)</button>
    <button id="btnReset">3. Resetear Imagen</button>
    <div class="control">
        <div class="reto-container">
            <label for="rangeUmbral"><b>Umbral de Binarizacion:</b></label>
            <input type="range" id="rangeUmbral" min="0" max="255" value="128">
        </div>
    </div>
    <script src="js/script.js"> </script>
</body>
</html>
