<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2 - Generador de UI</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        .controls {
            margin-bottom: 30px;
        }

        .box-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .color-item {
            width: 150px;
        }

        .color-box {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            border: 1px solid #cbd5e1;
        }

        .color-values {
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h2>Generador de Estados UI</h2>

    <div class="controls">
        <label>Selecciona el color base corporativo:</label>

        <input type="color" id="colorPicker" value="#2563eb">
    </div>

    <div class="box-container">

        <div class="color-item">
            <div id="boxBase" class="color-box">
                Base
            </div>

            <div id="valuesBase" class="color-values"></div>
        </div>

        <div class="color-item">
            <div id="boxHover" class="color-box">
                Hover (-15% L)
            </div>

            <div id="valuesHover" class="color-values"></div>
        </div>

        <div class="color-item">
            <div id="boxDisabled" class="color-box">
                Disable (0% S)
            </div>

            <div id="valuesDisabled" class="color-values"></div>
        </div>

        <div class="color-item">
            <div id="boxContrast" class="color-box">
             Alto Contraste
</div>
<div id="valuesContrast" class="color-values"></div>
        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
